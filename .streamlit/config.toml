[server]
# Serves the self-hosted fonts in static/fonts, so the app needs no CDN.
enableStaticServing = true
# Cloud containers have a low inotify watcher limit; source files are immutable
# there, so live file watching is unnecessary.
fileWatcherType = "none"
# Statements can be large; allow generous uploads.
maxUploadSize = 200

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Dark minimalist theme.
# Near-black ground, one restrained accent, hairline borders, square corners.
# Space Grotesk is the type: neutral in tone, angular in its terminals and
# geometric bowls. JetBrains Mono carries the code and numeric detail.
# ---------------------------------------------------------------------------
[theme]
base = "dark"

backgroundColor = "#0B0C0E"
secondaryBackgroundColor = "#14161A"
textColor = "#E7E9EC"
primaryColor = "#7DD3C0"
linkColor = "#7DD3C0"
borderColor = "#24272E"
dataframeBorderColor = "#24272E"
dataframeHeaderBackgroundColor = "#14161A"
codeBackgroundColor = "#14161A"

# Minimalist: no rounded corners, no widget chrome unless it earns it.
baseRadius = "0.15rem"
buttonRadius = "0.15rem"
showWidgetBorder = true
showSidebarBorder = true

font = "Space Grotesk"
headingFont = "Space Grotesk"
codeFont = "JetBrains Mono"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [600, 600, 600, 600, 500, 500]

# Chart palette: teal accent leading, then cool neutrals — legible on near-black
# and colour-blind safe in ordering.
chartCategoricalColors = [
  "#7DD3C0", "#8AB4F8", "#C9A0FF", "#F2A26B",
  "#E4757B", "#9AA4B2", "#5FBF9F", "#6E8FD6",
  "#B99CE6", "#D98F5A",
]
chartSequentialColors = [
  "#0E2A26", "#14403A", "#1A564E", "#216D62", "#288477",
  "#2F9B8B", "#45B3A2", "#66C7B8", "#8FDACE", "#BCEDE5",
]

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin.woff2"
weight = "400 700"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-ext.woff2"
weight = "400 700"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin.woff2"
weight = "400 600"
